# Builds the native iPhone app in `ios/` into an unsigned IPA, uploads it as an artifact, runs the UI tests on an
# iPhone simulator and, when they pass, publishes the IPA as the `ios-latest` release, so it has a permanent download
# link. The test report goes to the `ios-test-results/<branch>` branch. Sideloadly signs the IPA with the user's
# Apple ID when installing; see ios/README.md and ios/УСТАНОВКА-IPHONE.txt.

name: Build iOS app

on:
  push:
    paths:
      - ios/**
      - src/**
      - public/**
      - plugins/**
      - dev/postcss-*
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - postcss.config.ts
      - tsconfig*.json
      - .node-version
      - .npmrc
      - .github/workflows/ios.yml
  workflow_dispatch:
    inputs:
      ui_tests:
        description: >-
          Run only these UI tests, comma-separated classes or class/test, such as
          `UsabilityTests,CoreTests/testDemoAccount`; `-X` skips X; no release then
        required: false
        default: ''

permissions:
  contents: write

# A newer build of the same branch replaces one in progress. A push to a branch other than the default one builds
# nothing, so it gets a group of its own instead of cancelling a manual run of that branch.
concurrency:
  group: >-
    ios-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch'
    || github.ref_name == github.event.repository.default_branch) && 'build' || github.run_id }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ios-latest
  IPA_PATH: dist-ios/Liquidgram.ipa

jobs:
  # The web build runs on Linux, where Actions minutes are cheaper; the macOS job only runs Xcode
  web:
    # Pushes build only on the default branch, whatever its name is
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      # The `opus-recorder` git dependency has submodules on gitlab.xiph.org, which npm clones when
      # the GitHub tarball of the dependency is unavailable. The official GitHub mirrors keep CI off that host.
      - name: Use GitHub mirrors for xiph submodules
        run: git config --global url."https://github.com/xiph/".insteadOf "https://gitlab.xiph.org/xiph/"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:production

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            dist
            !dist/**/*.map
          if-no-files-found: error
          retention-days: 1

  build:
    needs: web
    # The build uses the newest stable Xcode on the image and its iOS SDK. macos-15 has Xcode 16 and Xcode 26
    # (iOS 26 SDK); switch to macos-26 when the build needs an Xcode release that macos-15 lacks.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Download web build
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: dist

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build IPA
        id: build-ipa
        run: |
          set -o pipefail
          bash ios/build-ipa.sh 2>&1 | tee "$RUNNER_TEMP/build-ipa.log"
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # Compiler errors as one annotation, so they are readable without downloading the full log
      - name: Report build errors
        if: failure() && steps.build-ipa.outcome == 'failure'
        run: |
          log="$RUNNER_TEMP/build-ipa.log"
          [ -f "$log" ] || exit 0
          errors="$(grep -E '(^|[^a-z])(error|fatal error):|BUILD FAILED|xcodegen|Testing failed' "$log" | head -n 80 || true)"
          [ -n "$errors" ] || errors="$(tail -n 60 "$log")"
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=IPA build failed::${errors}"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Liquidgram-iOS
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          # The IPA is a zip archive already
          compression-level: 0

      # UI tests of the Debug build on an iPhone simulator, see ios/LiquidgramUITests/README.md
      - name: Run UI tests
        id: ui-tests
        timeout-minutes: 45
        run: bash ios/run-ui-tests.sh "$RUNNER_TEMP/ui-test-results"
        env:
          UI_TESTS_WORK_DIR: ${{ runner.temp }}/ui-test-work
          UI_TESTS_ONLY: ${{ inputs.ui_tests }}

      # The report becomes the single commit of the `ios-test-results/<branch>` branch, where GitHub shows README.md
      # with the screenshots; annotations on the run page give the counts and the failures
      - name: Publish UI test results
        if: always()
        continue-on-error: true
        env:
          RESULTS_DIR: ${{ runner.temp }}/ui-test-results
          RESULTS_BRANCH: ios-test-results/${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d "$RESULTS_DIR" ] || exit 0
          node ios/LiquidgramUITests/Tools/report.mjs annotate "$RESULTS_DIR/summary.json"

          cd "$RESULTS_DIR"
          git init --quiet
          git add --all
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "UI test results of $GITHUB_REF_NAME at ${GITHUB_SHA:0:7}, run $GITHUB_RUN_ID"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$RESULTS_BRANCH"
          echo "::notice title=UI test report::$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$RESULTS_BRANCH"
          if [ -f contact-sheet.png ]; then
            echo "::notice title=UI test screenshots::$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$RESULTS_BRANCH/contact-sheet.png"
          fi

      # Manual runs on other branches only upload the artifact, so the release keeps the default branch's build.
      # Like every step without a status check, it runs only when the build and the UI tests succeeded, and only when
      # all of them ran.
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch && !inputs.ui_tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          sha256="$(shasum -a 256 "$IPA_PATH" | cut -d ' ' -f 1)"
          title="Liquidgram for iPhone"
          notes="Unsigned IPA of Liquidgram ${version}, build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}.
          Install it with Sideloadly: ios/УСТАНОВКА-IPHONE.txt (Russian) or ios/README.md (English).
          SHA-256: ${sha256}"

          # The tag follows the latest build, so the release always points at the commit it was built from
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" --title "$title" --notes "$notes"
          fi
          gh release upload "$RELEASE_TAG" "$IPA_PATH" --clobber
