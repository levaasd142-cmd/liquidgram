# Builds the web app and publishes it to GitHub Pages at https://<user>.github.io/<repo>/,
# a permanent HTTPS address for installing Liquidgram on an iPhone home screen.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pushes deploy only from the default branch, whatever its name is
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      # The `opus-recorder` git dependency has submodules on gitlab.xiph.org, which npm clones when
      # the GitHub tarball of the dependency is unavailable. The official GitHub mirrors keep CI off that host.
      - name: Use GitHub mirrors for xiph submodules
        run: git config --global url."https://github.com/xiph/".insteadOf "https://gitlab.xiph.org/xiph/"

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build:production
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
