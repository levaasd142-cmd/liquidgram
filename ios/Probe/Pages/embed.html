<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Embed probe</title>
  <style>
    body { margin: 0; padding: 48px 8px 8px; font: 13px -apple-system, sans-serif; background: #fff; color: #000; }
    iframe { display: block; border: 0; margin: 8px 0; }
  </style>
</head>
<body>
  <p id="status">A YouTube embed with the sandbox and permissions of Instant View embeds (src/components/iv/EmbedFrame.tsx).
    The app records the Referer header of each frame navigation.</p>
  <iframe
    width="352"
    height="198"
    src="https://www.youtube.com/embed/aqz-KE-bpKQ"
    title="YouTube embed"
    sandbox="allow-scripts allow-popups allow-forms allow-modals allow-same-origin allow-storage-access-by-user-activation"
    allow="clipboard-write;"
    allowfullscreen
  ></iframe>
  <iframe width="10" height="10" src="https://probe-referrer.invalid/embed" title="Referrer probe"></iframe>
  <script src="embed.js"></script>
</body>
</html>
