# XcodeGen spec of the native iPhone and iPad app. `build-ipa.sh` copies the production web build into
# `Liquidgram/WebApp`, generates `Liquidgram.xcodeproj` from this file and builds an unsigned IPA.
# Both the folder and the project are generated, so Git ignores them.
name: Liquidgram

options:
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: en
  createIntermediateGroups: true

targets:
  Liquidgram:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Liquidgram/Sources
      # The asset catalog, `bridge.js` and the English and Russian strings
      - path: Liquidgram/Resources
        buildPhase: resources
      # A folder reference keeps the directory structure of the web build in the app bundle
      - path: Liquidgram/WebApp
        name: WebApp
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Liquidgram
        PRODUCT_BUNDLE_IDENTIFIER: org.liquidgram.messenger
        INFOPLIST_FILE: Liquidgram/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # `build-ipa.sh` passes the version from package.json and the build number
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        # Swift 5 language mode: the Swift 6 data-race checks are not errors here
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The web build's PNG files are served to the page byte for byte
        COMPRESS_PNG_FILES: "NO"
        STRIP_PNG_TEXT: "NO"
        # The IPA is unsigned; Sideloadly signs it with the user's Apple ID when installing
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

schemes:
  Liquidgram:
    build:
      targets:
        Liquidgram: all
    run:
      config: Debug
    archive:
      config: Release
